<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disaster Safety Assistant</title>
<link rel="manifest" href="static/manifest.json">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icon.svg">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Disaster Safety Assistant: official NDMA safety steps, offline, in six languages.">
<link rel="stylesheet" href="static/style.css">
</head>
<body>

  <!-- First launch: choose a language (remembered; change later from the top bar). -->
  <section id="lang-screen" class="screen lang-screen" hidden aria-labelledby="lang-title">
    <div class="lang-head">
      <img class="mark" src="static/icon.svg" alt="">
      <h1 id="lang-title">Choose your language</h1>
      <p class="lang-sub">भाषा चुनें · மொழியைத் தேர்ந்தெடுக்கவும் · భాష ఎంచుకోండి · ಭಾಷೆ ಆಯ್ಕೆಮಾಡಿ · ഭാഷ തിരഞ്ഞെടുക്കുക</p>
    </div>
    <div class="lang-grid" role="radiogroup" aria-labelledby="lang-title">
      <button type="button" class="lang-chip" data-lang="en" role="radio">English</button>
      <button type="button" class="lang-chip" data-lang="hi" role="radio">हिन्दी</button>
      <button type="button" class="lang-chip" data-lang="ta" role="radio">தமிழ்</button>
      <button type="button" class="lang-chip" data-lang="te" role="radio">తెలుగు</button>
      <button type="button" class="lang-chip" data-lang="kn" role="radio">ಕನ್ನಡ</button>
      <button type="button" class="lang-chip" data-lang="ml" role="radio">മലയാളം</button>
    </div>
  </section>

  <!-- Home: one big mic, picture tiles, nothing else to read. -->
  <main id="home" class="screen home" hidden>
    <header class="appbar">
      <img class="mark small" src="static/icon.svg" alt="">
      <div class="appbar-title">
        <h1 data-i18n="title">Disaster Help</h1>
        <span class="status"><span id="status-dot" class="dot"></span><span id="status-text"></span></span>
      </div>
      <button id="lang-btn" type="button" class="lang-btn" aria-label="Change language"></button>
    </header>

    <section class="ask">
      <button id="mic-btn" type="button" class="mic" aria-describedby="mic-hint">
        <span class="level"></span><span class="ring r1"></span><span class="ring r2"></span><span class="spin"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z" fill="currentColor"/></svg>
      </button>
      <p id="mic-hint" class="mic-hint" aria-live="polite" data-i18n="micHint">Tap and say what's happening</p>
      <button id="type-btn" type="button" class="link-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6zm3 2v2h2V8H6zm4 0v2h2V8h-2zm4 0v2h2V8h-2zM6 12v2h2v-2H6zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2zm-6 4v2h8v-2H8z" fill="currentColor"/></svg>
        <span data-i18n="typeInstead">Type instead</span>
      </button>
      <form id="type-form" class="type-form" hidden>
        <input id="question-input" type="text" autocomplete="off" enterkeyhint="send" aria-label="Your question">
        <button id="ask-btn" type="submit" class="send" aria-label="Ask">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6-8-2z" fill="currentColor"/></svg>
        </button>
      </form>
    </section>

    <section class="tiles-wrap" aria-labelledby="tiles-title">
      <h2 id="tiles-title" data-i18n="tilesTitle">Or tap what's happening</h2>
      <div id="example-chips" class="tiles"></div>
    </section>

    <p class="fineprint"><span data-i18n="fineprint">Official NDMA guidance · works without internet · not a substitute for emergency services</span>
      <span id="build-tag" class="build-tag"></span></p>
  </main>

  <!-- Answer: slides up over home; phone Back button closes it. -->
  <section id="answer-screen" class="screen answer" hidden aria-labelledby="answer-title">
    <header class="answer-bar">
      <button id="back-btn" type="button" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z" fill="currentColor"/></svg>
      </button>
      <h2 id="answer-title" tabindex="-1"></h2>
    </header>
    <div id="phase-tabs" class="phase-tabs" role="tablist" hidden></div>
    <button id="listen-btn" type="button" class="listen-btn" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="currentColor"/></svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="listen-label"></span>
    </button>
    <div id="answer-body" class="answer-body" aria-live="polite"></div>
    <div class="answer-actions">
      <button id="again-btn" type="button" class="again-btn" data-i18n="askAnother">Ask another question</button>
    </div>
    <details id="answer-source" class="source" hidden></details>
  </section>

  <!-- Always visible: emergency numbers (verified registry: data/metadata/documents.json). -->
  <nav class="sos-bar" aria-label="Emergency numbers">
    <a class="sos" href="tel:112">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="currentColor"/></svg>
      <span data-i18n="call112">Call 112</span>
    </a>
    <a class="sos-alt" href="tel:1070" aria-label="Call 1070, Tamil Nadu state helpline">1070</a>
    <a class="sos-alt" href="tel:1077" aria-label="Call 1077, district helpline">1077</a>
  </nav>

  <script src="static/app.js"></script>
</body>
</html>
